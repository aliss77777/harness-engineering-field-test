# Phase 1 settings. Fixed 2026-10-07 before any Phase 1 paid call (briefs/Phase 1 design.md).
seed: 20261007
domains: [finance, hr]
phase0_task_ids_file: phase0/comparability_task_ids.txt   # these 50 never go into sealed

# The 2-round pilot of the Agent skill loop (Alexander, 2026-10-07). Practice and gate only; sealed untouched.
pilot:
  spend_cap_usd: 20.0        # hard cap for the pilot, enforced in code
  rounds: 2
  practice_per_round: 30     # fresh seeded sample of the 60 practice tasks each round
  gate_size: 40              # fixed seeded sample of the 60 gate tasks, the same every round
  candidates_per_round: 2
  mistakes_shown: 8          # fresh seeded sample of failed practice runs shown to the editor
  gate_p_threshold: 0.10     # keep an edit if mean credit rises and one-sided Wilcoxon p < 0.10 (v1's gate level)
  workers: 8
  cost_per_run_estimate: 0.062   # MiniMax, Phase 0 average; for the spend guard

# Agent and editor: MiniMax M3, same settings and pinned host as Phase 0 (phase0/config_phase0.yaml).
agent_model: minimax

# ---- The v2 Phase 1 experiments (scripts/phase1_run.py). Written 2026-10-08; approved to run 2026-10-09 (sealed stage still held). ----
run:
  take: 2                 # Take 1: p-value keep test (stopped after round 2, nothing kept); Take 2: margin keep test (Alexander, 2026-10-10)
  approved: true             # Alexander's go, 2026-10-09; paid stages (not sealed) may run. Sealed also needs SEALED_RELEASE.md
  spend_cap_usd: 120.0       # safety stop, set by Alexander 2026-10-09 ($110) and raised to $120 on 2026-10-10 for the sealed exam; cost goals are directional
  agent_temperature: 0.0     # agents (MiniMax, Gemini); not fully repeatable, but steadier
  editor_temperature: 0.7    # MiniMax as editor (both loops)
  workers: 8
  checkpoint_during_learning: true   # checkpoint on for learning AND the final test (canonical design, 2026-10-09)
  skill_loop:
    rounds: 4
    practice_per_round: 30   # fresh seeded sample of the 60 practice tasks each round
    test_bench_tasks: 60     # all of them
    runs_per_task: 1         # one run per task everywhere (canonical design, 2026-10-09)
    candidates_per_round: 2
    mistakes_shown: 8
    keep_test: margin        # Take 1 used p_value; Take 2 uses margin (targeted change > 0, credit up by min_credit_gain, passes not lower)
    min_credit_gain: 0.02    # margin test: whole test bench mean credit must rise by at least this
    p_threshold: 0.10        # p_value test only (Take 1)
    max_regression_drop: 0.03
  rubric_loop:
    rounds: 3
    candidates_per_round: 2
    mistakes_shown: 8
    p_threshold: 0.10        # v1's McNemar keep-or-reject test
  router:
    escalate_share: 0.30     # tau escalates 30% of test bench runs; frozen before sealed
  sealed:
    release_file: phase1/SEALED_RELEASE.md   # Alexander writes this to release the sealed set; nothing runs on sealed without it
  cost_estimate_per_run: {minimax: 0.06, gemini: 0.32, jev_call: 0.002}   # jev_call: Jev redesign (4 Jev calls and 4 question-writer calls per run), measured at about $0.0016
jev:
  model: typesafe/jev-1.13
  expected_model: typesafe/jev-1.13-20260917
  expected_provider: TypeSafe
